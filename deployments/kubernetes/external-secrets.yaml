# Syncs platform secrets from the cloud secret manager provisioned by
# deployments/terraform/<cloud>. Requires the External Secrets Operator and a
# ClusterSecretStore named "platform-secrets" bound to that secret manager.
# Remote keys match the names Terraform creates (database URL) and the
# runbook creates (audit signing key, docs/runbooks/startup.md).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agentops-slo-platform-database
  namespace: agentops
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: agentops-slo-platform-database
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: agentops-slo-platform-database-url
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: agentops-slo-platform-audit-key
  namespace: agentops
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: platform-secrets
  target:
    name: agentops-slo-platform-audit-key
    creationPolicy: Owner
  dataFrom:
    - find:
        name:
          regexp: "^agentops-slo-platform-audit-key-"
      rewrite:
        - regexp:
            source: "^agentops-slo-platform-audit-key-(.*)$"
            target: "audit-$1.pem"
