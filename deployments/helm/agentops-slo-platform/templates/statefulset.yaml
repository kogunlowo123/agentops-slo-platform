{{- /*
StatefulSet so each replica owns a persistent volume for its own signed
audit chain (/var/lib/agentops/audit/<pod>.jsonl). A log shipper copies the
files to WORM object storage provisioned by Terraform. Span facts, SLOs and
alert state live in PostgreSQL and are shared by all replicas.
*/ -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "agentops.fullname" . }}
  labels: {{- include "agentops.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "agentops.fullname" . }}-headless
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  podManagementPolicy: Parallel
  selector:
    matchLabels: {{- include "agentops.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentops.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}{{ toYaml . | nindent 8 }}{{ end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - {{- toYaml . | nindent 10 }}
          labelSelector:
            matchLabels: {{- include "agentops.selectorLabels" $ | nindent 14 }}
        {{- end }}
      {{- end }}
      containers:
        - name: agentops
          image: {{ include "agentops.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: {{ include "agentops.fullname" . }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AGENTOPS_AUDIT_LOG_PATH
              value: /var/lib/agentops/audit/$(POD_NAME).jsonl
            - name: AGENTOPS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.database }}
                  key: DATABASE_URL
            - name: AGENTOPS_FORWARDED_ALLOW_IPS
              value: "*"
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            failureThreshold: 3
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 24
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: audit-key
              mountPath: /etc/agentops/audit-key
              readOnly: true
            - name: audit
              mountPath: /var/lib/agentops/audit
            - name: tmp
              mountPath: /tmp
            {{- if .Values.slos }}
            - name: slos
              mountPath: /etc/agentops/slos
              readOnly: true
            {{- end }}
            {{- if and .Values.fabric.url .Values.fabric.agentId }}
            - name: workload-token
              mountPath: /var/run/secrets/agentops/workload
              readOnly: true
            {{- end }}
      volumes:
        - name: audit-key
          secret:
            secretName: {{ .Values.secrets.auditKey }}
            defaultMode: 0400
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if .Values.slos }}
        - name: slos
          configMap:
            name: {{ include "agentops.fullname" . }}-slos
        {{- end }}
        {{- if and .Values.fabric.url .Values.fabric.agentId }}
        - name: workload-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ required "fabric.workloadAudience is required" .Values.fabric.workloadAudience | quote }}
                  expirationSeconds: 3600
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: audit
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.audit.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.audit.size }}
