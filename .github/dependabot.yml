version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: terraform
    directories: [/deployments/terraform/aws, /deployments/terraform/azure, /deployments/terraform/gcp]
    schedule: {interval: weekly}
